<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <!-- Cadastro dos elementos -->
        <script src="elementos.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">

        <!-- PAINEL DE INFORMAÇÕES -->
        <div
            id="info-elemento"
            style="
                display: none;
                position: fixed;
                left: 10px;
                right: 10px;
                bottom: 10px;
                z-index: 9999;
                background: rgba(0,0,0,0.88);
                color: white;
                border: 2px solid white;
                border-radius: 12px;
                padding: 11px 12px;
                font-family: Arial, sans-serif;
                font-size: 15px;
                line-height: 1.35;
                text-align: center;
            "
        >
            <div
                id="nome-elemento"
                style="font-size: 22px; font-weight: bold; margin-bottom: 4px;"
            ></div>

            <div id="linha-1"></div>
            <div id="linha-2"></div>
            <div id="linha-3" style="margin-top: 4px;"></div>
            <div id="linha-4"></div>
            <div id="linha-5" style="margin-top: 4px;"></div>
        </div>

        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets id="assets-dinamicos"></a-assets>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            (function () {
                var scene = document.getElementById("scene");
                var assets = document.getElementById("assets-dinamicos");

                var painel = document.getElementById("info-elemento");
                var nome = document.getElementById("nome-elemento");
                var linha1 = document.getElementById("linha-1");
                var linha2 = document.getElementById("linha-2");
                var linha3 = document.getElementById("linha-3");
                var linha4 = document.getElementById("linha-4");
                var linha5 = document.getElementById("linha-5");

                var visiveis = {};
                var ordemReconhecimento = [];

                function mostrarElemento(elemento) {
                    nome.innerHTML =
                        elemento.nome + " — " + elemento.simbolo;

                    linha1.innerHTML =
                        "<strong>Número atômico:</strong> " +
                        elemento.numeroAtomico +
                        " &nbsp;•&nbsp; <strong>Grupo:</strong> " +
                        elemento.grupo +
                        " &nbsp;•&nbsp; <strong>Período:</strong> " +
                        elemento.periodo;

                    linha2.innerHTML =
                        "<strong>" + elemento.familia + "</strong>" +
                        " &nbsp;•&nbsp; <strong>Estado:</strong> " +
                        elemento.estado;

                    linha3.innerHTML =
                        "<strong>Distribuição eletrônica:</strong> " +
                        elemento.distribuicao;

                    linha4.innerHTML =
                        "<strong>Configuração:</strong> " +
                        elemento.configuracao;

                    linha5.innerHTML =
                        "<strong>" + elemento.valencia + "</strong>" +
                        " &nbsp;•&nbsp; <strong>Íon mais comum:</strong> " +
                        elemento.ion;

                    painel.style.display = "block";
                }

                function removerDaOrdem(id) {
                    ordemReconhecimento =
                        ordemReconhecimento.filter(function (item) {
                            return item !== id;
                        });
                }

                function atualizarDepoisDaPerda(id) {
                    visiveis[id] = false;
                    removerDaOrdem(id);

                    if (ordemReconhecimento.length === 0) {
                        painel.style.display = "none";
                        return;
                    }

                    var ultimoId =
                        ordemReconhecimento[ordemReconhecimento.length - 1];

                    var elementoRestante =
                        window.ELEMENTOS.find(function (e) {
                            return e.id === ultimoId;
                        });

                    if (elementoRestante) {
                        mostrarElemento(elementoRestante);
                    }
                }

                window.ELEMENTOS.forEach(function (elemento) {

                    // -------------------------
                    // CARREGA O MODELO 3D
                    // -------------------------
                    var asset = document.createElement("a-asset-item");
                    asset.setAttribute("id", "modelo-" + elemento.id);
                    asset.setAttribute("src", elemento.modelo);
                    assets.appendChild(asset);

                    // -------------------------
                    // CRIA O MARCADOR
                    // -------------------------
                    var marker = document.createElement("a-marker");

                    marker.setAttribute("id", "marker-" + elemento.id);
                    marker.setAttribute("type", "pattern");
                    marker.setAttribute("preset", "custom");
                    marker.setAttribute("url", elemento.marcador);
                    marker.setAttribute(
                        "raycaster",
                        "objects: .clickable"
                    );
                    marker.setAttribute("emitevents", "true");
                    marker.setAttribute(
                        "cursor",
                        "fuse: false; rayOrigin: mouse;"
                    );

                    // -------------------------
                    // CRIA O MODELO NO MARCADOR
                    // -------------------------
                    var modelo = document.createElement("a-entity");

                    modelo.setAttribute(
                        "id",
                        "modelo-" + elemento.id + "-entidade"
                    );

                    modelo.setAttribute(
                        "scale",
                        "0.5607348115010105 0.5607348115010105 0.5607348115010105"
                    );

                    modelo.setAttribute(
                        "animation-mixer",
                        "loop: repeat"
                    );

                    modelo.setAttribute(
                        "gltf-model",
                        "#modelo-" + elemento.id
                    );

                    modelo.setAttribute(
                        "class",
                        "clickable"
                    );

                    modelo.setAttribute(
                        "gesture-handler",
                        ""
                    );

                    marker.appendChild(modelo);
                    scene.appendChild(marker);

                    // -------------------------
                    // EVENTOS DE RECONHECIMENTO
                    // -------------------------
                    marker.addEventListener(
                        "markerFound",
                        function () {
                            visiveis[elemento.id] = true;

                            removerDaOrdem(elemento.id);
                            ordemReconhecimento.push(elemento.id);

                            mostrarElemento(elemento);
                        }
                    );

                    marker.addEventListener(
                        "markerLost",
                        function () {
                            atualizarDepoisDaPerda(elemento.id);
                        }
                    );
                });

            })();
        </script>
    </body>
</html>
