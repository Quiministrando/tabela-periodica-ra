<!doctype html>
<html>
<head>
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
<script src="elementos.js"></script>

<script>
AFRAME.registerComponent("persistent-gesture-handler", {
    schema: {
        enabled: { default: true },
        rotationFactor: { default: 5 },
        minScale: { default: 0.3 },
        maxScale: { default: 8 }
    },

    init: function () {
        this.handleRotation = this.handleRotation.bind(this);
        this.handleScale = this.handleScale.bind(this);

        this.initialScale = this.el.object3D.scale.clone();
        this.scaleFactor = 1;

        this.el.sceneEl.addEventListener("onefingermove", this.handleRotation);
        this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
    },

    remove: function () {
        this.el.sceneEl.removeEventListener("onefingermove", this.handleRotation);
        this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
    },

    handleRotation: function (event) {
        if (!this.data.enabled) return;

        this.el.object3D.rotation.y +=
            event.detail.positionChange.x * this.data.rotationFactor;

        this.el.object3D.rotation.x +=
            event.detail.positionChange.y * this.data.rotationFactor;
    },

    handleScale: function (event) {
        if (!this.data.enabled || !event.detail.startSpread) return;

        this.scaleFactor *=
            1 + event.detail.spreadChange / event.detail.startSpread;

        this.scaleFactor = Math.min(
            Math.max(this.scaleFactor, this.data.minScale),
            this.data.maxScale
        );

        this.el.object3D.scale.set(
            this.initialScale.x * this.scaleFactor,
            this.initialScale.y * this.scaleFactor,
            this.initialScale.z * this.scaleFactor
        );
    },

    resetViewer: function () {
        this.scaleFactor = 1;
        this.el.object3D.scale.copy(this.initialScale);
        this.el.object3D.rotation.set(0, 0, 0);
        this.el.object3D.position.set(0, 0, -2.5);
    }
});
</script>
</head>

<body style="margin:0; overflow:hidden;">

<button id="botao-explorar" type="button"
style="display:none;position:fixed;right:14px;bottom:18px;z-index:10000;background:rgba(0,0,0,.88);color:white;border:2px solid white;border-radius:14px;padding:12px 16px;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;cursor:pointer;">
☰ Explorar
</button>

<button id="botao-recentrar" type="button"
style="display:none;position:fixed;left:14px;bottom:18px;z-index:10000;background:rgba(0,0,0,.78);color:white;border:1px solid white;border-radius:12px;padding:10px 13px;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;cursor:pointer;">
⌖ Recentrar
</button>

<div id="aviso-selecao"
style="display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:15000;background:rgba(0,0,0,.82);color:white;border:1px solid white;border-radius:10px;padding:7px 11px;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;white-space:nowrap;">
</div>

<div id="menu-elemento"
style="display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:10001;background:rgba(0,0,0,.93);color:white;border:2px solid white;border-radius:14px;padding:14px;font-family:Arial,sans-serif;font-size:15px;line-height:1.4;text-align:left;max-height:72%;overflow-y:auto;">

    <!-- TELA PRINCIPAL DO MENU -->
    <div id="tela-principal">

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
            <div id="nome-elemento" style="font-size:23px;font-weight:bold;"></div>

            <button id="botao-fechar" type="button" aria-label="Fechar menu"
            style="flex:0 0 auto;background:white;color:black;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;font-weight:bold;cursor:pointer;">
            ×
            </button>
        </div>

        <div style="border-top:1px solid rgba(255,255,255,.55);padding-top:10px;">
            <div id="linha-1"></div>
            <div id="linha-2" style="margin-top:3px;"></div>
            <div id="linha-3" style="margin-top:8px;"></div>
            <div id="linha-4" style="margin-top:3px;"></div>
            <div id="linha-5" style="margin-top:8px;"></div>
        </div>

        <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.55);">

            <button id="botao-audio" type="button"
            style="width:100%;margin-bottom:8px;padding:11px;border-radius:10px;border:1px solid white;background:white;color:black;font-size:15px;font-weight:bold;cursor:pointer;">
            🔊 Ouvir descrição
            </button>

            <button id="botao-curiosidades" type="button"
            style="width:100%;margin-bottom:8px;padding:11px;border-radius:10px;border:1px solid white;background:white;color:black;font-size:15px;font-weight:bold;cursor:pointer;">
            💡 Curiosidades
            </button>

            <button type="button" disabled
            style="width:100%;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.12);color:rgba(255,255,255,.70);font-size:15px;">
            ⚛ Explorar formação do íon — em breve
            </button>

        </div>
    </div>

    <!-- TELA DE CURIOSIDADES -->
    <div id="tela-curiosidades" style="display:none;">

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
            <div id="titulo-curiosidades" style="font-size:22px;font-weight:bold;">
                💡 Curiosidades
            </div>

            <button id="fechar-curiosidades" type="button" aria-label="Fechar menu"
            style="flex:0 0 auto;background:white;color:black;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;font-weight:bold;cursor:pointer;">
            ×
            </button>
        </div>

        <div id="lista-curiosidades"
        style="border-top:1px solid rgba(255,255,255,.55);padding-top:10px;">
        </div>

        <div id="bloco-pergunta"
        style="display:none;margin-top:14px;padding:12px;border:1px solid white;border-radius:10px;background:rgba(255,255,255,.10);">
            <div style="font-weight:bold;margin-bottom:5px;">🔎 Observe e responda</div>
            <div id="pergunta-observacao"></div>
        </div>

        <button id="voltar-curiosidades" type="button"
        style="width:100%;margin-top:14px;padding:11px;border-radius:10px;border:1px solid white;background:white;color:black;font-size:15px;font-weight:bold;cursor:pointer;">
        ← Voltar
        </button>

    </div>
</div>

<a-scene
vr-mode-ui="enabled: false;"
loading-screen="enabled: false;"
renderer="logarithmicDepthBuffer: true;"
arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
id="scene"
embedded
gesture-detector>

<a-assets id="assets-dinamicos"></a-assets>

<a-entity id="camera-ra" camera>
    <a-entity
        id="viewer"
        position="0 0 -2.5"
        scale="0.5607348115010105 0.5607348115010105 0.5607348115010105"
        rotation="0 0 0"
        visible="false"
        persistent-gesture-handler>
    </a-entity>
</a-entity>

</a-scene>

<script>
(function () {

    var scene = document.getElementById("scene");
    var assets = document.getElementById("assets-dinamicos");
    var viewer = document.getElementById("viewer");

    var botaoExplorar = document.getElementById("botao-explorar");
    var botaoRecentrar = document.getElementById("botao-recentrar");
    var botaoFechar = document.getElementById("botao-fechar");
    var botaoAudio = document.getElementById("botao-audio");
    var botaoCuriosidades = document.getElementById("botao-curiosidades");

    var menu = document.getElementById("menu-elemento");
    var telaPrincipal = document.getElementById("tela-principal");
    var telaCuriosidades = document.getElementById("tela-curiosidades");

    var fecharCuriosidades = document.getElementById("fechar-curiosidades");
    var voltarCuriosidades = document.getElementById("voltar-curiosidades");
    var listaCuriosidades = document.getElementById("lista-curiosidades");
    var tituloCuriosidades = document.getElementById("titulo-curiosidades");
    var blocoPergunta = document.getElementById("bloco-pergunta");
    var perguntaObservacao = document.getElementById("pergunta-observacao");

    var avisoSelecao = document.getElementById("aviso-selecao");

    var nome = document.getElementById("nome-elemento");
    var linha1 = document.getElementById("linha-1");
    var linha2 = document.getElementById("linha-2");
    var linha3 = document.getElementById("linha-3");
    var linha4 = document.getElementById("linha-4");
    var linha5 = document.getElementById("linha-5");

    var elementoAtual = null;
    var modelos = {};
    var timerAviso = null;

    var audioPlayer = new Audio();
    audioPlayer.preload = "none";

    function preencherDados(e) {
        elementoAtual = e;

        nome.innerHTML = e.nome + " — " + e.simbolo;

        linha1.innerHTML =
            "<strong>Número atômico:</strong> " + e.numeroAtomico +
            " &nbsp;•&nbsp; <strong>Grupo:</strong> " + e.grupo +
            " &nbsp;•&nbsp; <strong>Período:</strong> " + e.periodo;

        linha2.innerHTML =
            "<strong>" + e.familia + "</strong>" +
            " &nbsp;•&nbsp; <strong>Estado:</strong> " + e.estado;

        linha3.innerHTML =
            "<strong>Distribuição eletrônica:</strong> " + e.distribuicao;

        linha4.innerHTML =
            "<strong>Configuração:</strong> " + e.configuracao;

        linha5.innerHTML =
            "<strong>" + e.valencia + "</strong>" +
            " &nbsp;•&nbsp; <strong>Íon mais comum:</strong> " + e.ion;

        botaoExplorar.innerHTML = "☰ Explorar " + e.simbolo;

        // Curiosidades só ficam ativas quando o elemento possuir conteúdo.
        if (e.curiosidades && e.curiosidades.length > 0) {
            botaoCuriosidades.disabled = false;
            botaoCuriosidades.textContent = "💡 Curiosidades";
            botaoCuriosidades.style.background = "white";
            botaoCuriosidades.style.color = "black";
            botaoCuriosidades.style.opacity = "1";
            botaoCuriosidades.style.cursor = "pointer";
        } else {
            botaoCuriosidades.disabled = true;
            botaoCuriosidades.textContent = "💡 Curiosidades — em breve";
            botaoCuriosidades.style.background = "rgba(255,255,255,.12)";
            botaoCuriosidades.style.color = "rgba(255,255,255,.70)";
            botaoCuriosidades.style.opacity = "1";
            botaoCuriosidades.style.cursor = "default";
        }
    }

    function preencherCuriosidades(e) {
        listaCuriosidades.innerHTML = "";
        tituloCuriosidades.textContent = "💡 Curiosidades sobre " + e.nome;

        (e.curiosidades || []).forEach(function (item) {
            var bloco = document.createElement("div");

            bloco.style.marginBottom = "12px";
            bloco.style.paddingBottom = "10px";
            bloco.style.borderBottom = "1px solid rgba(255,255,255,.25)";

            bloco.innerHTML =
                '<div style="font-weight:bold;font-size:16px;margin-bottom:3px;">' +
                item.icone + " " + item.titulo +
                '</div>' +
                '<div>' + item.texto + '</div>';

            listaCuriosidades.appendChild(bloco);
        });

        if (e.perguntaObservacao) {
            perguntaObservacao.textContent = e.perguntaObservacao;
            blocoPergunta.style.display = "block";
        } else {
            blocoPergunta.style.display = "none";
        }
    }

    function mostrarAviso(e) {
        avisoSelecao.textContent =
            "✓ " + e.nome + " (" + e.simbolo + ") selecionado";

        avisoSelecao.style.display = "block";

        if (timerAviso) clearTimeout(timerAviso);

        timerAviso = setTimeout(function () {
            avisoSelecao.style.display = "none";
        }, 1300);
    }

    function resetViewer() {
        var comp = viewer.components["persistent-gesture-handler"];

        if (comp && comp.resetViewer) {
            comp.resetViewer();
        } else {
            viewer.setAttribute("position", "0 0 -2.5");
            viewer.setAttribute("rotation", "0 0 0");
            viewer.setAttribute(
                "scale",
                "0.5607348115010105 0.5607348115010105 0.5607348115010105"
            );
        }
    }

    function esconderTodosModelos() {
        Object.keys(modelos).forEach(function (id) {
            modelos[id].setAttribute("visible", "false");
        });
    }

    function selecionarElemento(e) {

        // Para qualquer áudio anterior ao trocar de elemento.
        if (!audioPlayer.paused) {
            audioPlayer.pause();
        }

        audioPlayer.currentTime = 0;
        audioPlayer.removeAttribute("src");
        audioPlayer.removeAttribute("data-elemento");
        audioPlayer.load();

        botaoAudio.textContent = "🔊 Ouvir descrição";

        preencherDados(e);

        esconderTodosModelos();

        if (modelos[e.id]) {
            modelos[e.id].setAttribute("visible", "true");
        }

        viewer.setAttribute("visible", "true");
        resetViewer();

        telaPrincipal.style.display = "block";
        telaCuriosidades.style.display = "none";
        menu.style.display = "none";

        botaoExplorar.style.display = "block";
        botaoRecentrar.style.display = "block";

        mostrarAviso(e);
    }

    // ÁUDIO
    botaoAudio.addEventListener("click", function () {
        if (!elementoAtual || !elementoAtual.audio) return;

        if (!audioPlayer.paused && !audioPlayer.ended) {
            audioPlayer.pause();
            botaoAudio.textContent = "▶ Continuar descrição";
            return;
        }

        if (
            !audioPlayer.src ||
            audioPlayer.dataset.elemento !== elementoAtual.id
        ) {
            audioPlayer.src = elementoAtual.audio;
            audioPlayer.dataset.elemento = elementoAtual.id;
            audioPlayer.load();
        }

        audioPlayer.play().then(function () {
            botaoAudio.textContent = "⏸ Pausar descrição";
        }).catch(function () {
            botaoAudio.textContent = "🔇 Áudio ainda não disponível";
        });
    });

    audioPlayer.addEventListener("ended", function () {
        botaoAudio.textContent = "🔊 Ouvir descrição";
    });

    audioPlayer.addEventListener("error", function () {
        botaoAudio.textContent = "🔇 Áudio ainda não disponível";
    });

    // CURIOSIDADES
    botaoCuriosidades.addEventListener("click", function () {
        if (
            !elementoAtual ||
            !elementoAtual.curiosidades ||
            elementoAtual.curiosidades.length === 0
        ) {
            return;
        }

        preencherCuriosidades(elementoAtual);

        telaPrincipal.style.display = "none";
        telaCuriosidades.style.display = "block";
    });

    voltarCuriosidades.addEventListener("click", function () {
        telaCuriosidades.style.display = "none";
        telaPrincipal.style.display = "block";
    });

    fecharCuriosidades.addEventListener("click", function () {
        telaCuriosidades.style.display = "none";
        telaPrincipal.style.display = "block";
        menu.style.display = "none";

        if (elementoAtual) {
            botaoExplorar.style.display = "block";
            botaoRecentrar.style.display = "block";
        }
    });

    botaoExplorar.addEventListener("click", function () {
        if (!elementoAtual) return;

        botaoExplorar.style.display = "none";
        botaoRecentrar.style.display = "none";

        telaPrincipal.style.display = "block";
        telaCuriosidades.style.display = "none";

        menu.style.display = "block";
    });

    botaoFechar.addEventListener("click", function () {
        menu.style.display = "none";

        if (elementoAtual) {
            botaoExplorar.style.display = "block";
            botaoRecentrar.style.display = "block";
        }
    });

    botaoRecentrar.addEventListener("click", function () {
        if (!elementoAtual) return;
        resetViewer();
    });

    // MODELOS + MARCADORES
    window.ELEMENTOS.forEach(function (e) {

        var asset = document.createElement("a-asset-item");
        asset.setAttribute("id", "asset-" + e.id);
        asset.setAttribute("src", e.modelo);
        assets.appendChild(asset);

        var modelo = document.createElement("a-entity");
        modelo.setAttribute("id", "modelo-viewer-" + e.id);
        modelo.setAttribute("gltf-model", "#asset-" + e.id);
        modelo.setAttribute("visible", "false");

        viewer.appendChild(modelo);
        modelos[e.id] = modelo;

        var marker = document.createElement("a-marker");
        marker.setAttribute("id", "marker-" + e.id);
        marker.setAttribute("type", "pattern");
        marker.setAttribute("preset", "custom");
        marker.setAttribute("url", e.marcador);
        marker.setAttribute("emitevents", "true");

        scene.appendChild(marker);

        marker.addEventListener("markerFound", function () {
            selecionarElemento(e);
        });
    });

})();
</script>

</body>
</html>
